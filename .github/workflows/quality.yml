name: ShareNotes reusable quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps

      - name: Backend lint
        run: npm run lint

      - name: Backend build
        run: npm run build

      - name: Backend unit tests with evidence
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=.vitest-backend.json
          status=$?
          node - <<'NODE'
          const fs = require('fs');
          const path = '.vitest-backend.json';
          let summary = '## Backend quality gate evidence\n\n';
          let counts = { numTotalTests: 0, numPassedTests: 0, numFailedTests: 0 };

          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            counts = {
              numTotalTests: Number(data.numTotalTests || 0),
              numPassedTests: Number(data.numPassedTests || 0),
              numFailedTests: Number(data.numFailedTests || 0),
            };
          }

          summary += `- Backend unit tests: ${counts.numPassedTests} passed, ${counts.numFailedTests} failed, ${counts.numTotalTests} total\n`;
          summary += '- Backend lint: passed\n';
          summary += '- Backend build: passed\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
          exit $status

      - name: Backend E2E tests with evidence
        shell: bash
        run: |
          set +e
          npx vitest run --config ./vitest.config.e2e.ts --reporter=json --outputFile=.vitest-backend-e2e.json
          status=$?
          node - <<'NODE'
          const fs = require('fs');
          const path = '.vitest-backend-e2e.json';
          let summary = '## Backend E2E quality gate evidence\n\n';
          let counts = { numTotalTests: 0, numPassedTests: 0, numFailedTests: 0 };

          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            counts = {
              numTotalTests: Number(data.numTotalTests || 0),
              numPassedTests: Number(data.numPassedTests || 0),
              numFailedTests: Number(data.numFailedTests || 0),
            };
          }

          summary += `- Backend E2E tests: ${counts.numPassedTests} passed, ${counts.numFailedTests} failed, ${counts.numTotalTests} total\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps

      - name: Frontend tests
        id: frontend-test
        run: npm test

      - name: Frontend lint
        id: frontend-lint
        run: npm run lint

      - name: Frontend build
        id: frontend-build
        run: npm run build

      - name: Frontend quality summary
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.frontend-test.outcome }}
          LINT_OUTCOME: ${{ steps.frontend-lint.outcome }}
          BUILD_OUTCOME: ${{ steps.frontend-build.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let summary = '## Frontend quality gate evidence\n\n';
          summary += `- Frontend tests: ${process.env.TEST_OUTCOME}\n`;
          summary += `- Frontend lint: ${process.env.LINT_OUTCOME}\n`;
          summary += `- Frontend build: ${process.env.BUILD_OUTCOME}\n`;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
